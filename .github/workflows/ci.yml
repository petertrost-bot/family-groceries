# Every gate a PR must pass. ci-ok is the single required check.
# Structure (concurrency, SHA-pinned actions, ci-ok gate) follows trost-systems/emotely.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  SUPABASE_CLI_VERSION: 2.121.0
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan full history
        run: gitleaks git --no-banner --redact --verbose .
      - name: Scan working tree
        run: gitleaks dir --no-banner --redact --verbose .

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Generated l10n matches the ARB files
        run: flutter gen-l10n && git diff --exit-code -- lib/l10n
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Web build (production config)
        run: flutter build web --release --no-web-resources-cdn --no-wasm-dry-run

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno test --allow-env --allow-net
      # Job 2: the classifier dictionary and the migration generated from it.
      - name: Classifier dictionary matches its migration
        working-directory: supabase/classifier
        run: deno fmt --check && deno lint && deno test --allow-read
      # Job 07: API-based migration deploy and the per-function import maps.
      - name: Deploy tooling tests
        working-directory: supabase/deploy
        run: deno fmt --check && deno lint && deno test --allow-read
      # Job 05: the fg verification CLI (.cursor/skills/verify-family-groceries).
      - name: fg CLI fmt, lint, tests
        working-directory: .cursor/skills/verify-family-groceries/cli
        run: deno fmt --check && deno lint && deno test --allow-all

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      # Supabase binds 54320-54329, inside Linux's default ephemeral range
      # (32768-60999); an outbound socket on the runner can already hold one.
      - name: Keep ephemeral ports clear of the Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_port_range="60000 65000"
      - run: supabase db start
      - run: supabase test db
      - run: supabase/classifier/sweep.sh
      - run: supabase db lint --local --fail-on warning

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      # Supabase binds 54320-54329, inside Linux's default ephemeral range
      # (32768-60999); an outbound socket on the runner can already hold one.
      - name: Keep ephemeral ports clear of the Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_port_range="60000 65000"
      - name: Start the local Supabase stack
        run: supabase start
      - name: Export local stack URLs and publishable key
        run: |
          supabase status -o env | sed -n 's/^API_URL=/SUPABASE_URL=/p; s/^PUBLISHABLE_KEY=/SUPABASE_PUBLISHABLE_KEY=/p; s/^MAILPIT_URL=/MAILPIT_URL=/p' | tr -d '"' >> "$GITHUB_ENV"
      - name: Build the web app against the local stack
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn --no-wasm-dry-run \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define-from-file=config/e2e.json
      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: e2e
        run: npx playwright test
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}/e2e/screenshots
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/screenshots
          retention-days: 14

  # Job 4 (release): the Gemfile.lock installs and the Fastfile parses.
  fastlane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          working-directory: app
          bundler-cache: true
      - run: bundle exec fastlane lanes

  ci-ok:
    needs: [gitleaks, app, functions, database, e2e, fastlane]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
